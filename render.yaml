services:
  - type: web
    name: rembr-web
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    branch: master
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build --workspace @rembr/api && npm run build --workspace @rembr/web
    startCommand: npm run start --workspace @rembr/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: SERVE_WEB
        value: "true"
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        value: https://uipkxmuzsjbxnoiasuhn.supabase.co
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: worker
    name: rembr-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    region: singapore
    plan: 0.5c-512mb
    branch: master
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        value: https://uipkxmuzsjbxnoiasuhn.supabase.co
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
