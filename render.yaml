services:
  - type: web
    name: rembr-web
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    branch: master
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build --workspace @rembr/api && npm run build --workspace @rembr/web
    startCommand: npm run start --workspace @rembr/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: SERVE_WEB
        value: "true"
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        value: https://uipkxmuzsjbxnoiasuhn.supabase.co
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: META_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: worker
    name: rembr-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    region: singapore
    plan: 0.5c-512mb
    branch: master
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        value: https://uipkxmuzsjbxnoiasuhn.supabase.co
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: META_API_KEY
        sync: false
      - key: LOCAL_OCR_ENABLED
        value: "false"
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract
      - key: LOCAL_OCR_TIMEOUT_MS
        value: "30000"
      - key: LOCAL_ASR_ENABLED
        value: "false"
      - key: WHISPER_PATH
        value: whisper
      - key: WHISPER_MODEL_PATH
        value: ""
      - key: LOCAL_ASR_TIMEOUT_MS
        value: "300000"
      - key: LOCAL_VISUAL_EMBEDDING_ENABLED
        value: "false"
      - key: VISUAL_EMBEDDING_PATH
        value: rembr-visual-embedding
      - key: VISUAL_EMBEDDING_MODEL
        value: local-ml-visual
      - key: LOCAL_VISUAL_EMBEDDING_TIMEOUT_MS
        value: "60000"
